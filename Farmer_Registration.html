<h1 style="color: rgb(36, 6, 5); text-align: center;">Farmer
Registration</h1>
<form id="registrationForm" action="#" method="post"
enctype="multipart/form-data">
<fieldset>
<legend>Farmer Details</legend>
<!-- Name -->
<div class="form-group">
<label for="name">Farmer Name:</label><br>
<input type="text" id="name" name="name" placeholder="Enter
your full name">
<span id="nameError" class="error"></span>
</div>
<!-- Mobile Number -->
<div class="form-group">
<label for="mobile">Mobile Number:</label><br>
<input type="tel" id="mobile" name="mobile"
placeholder="e.g., xxxxxxxxxx" pattern="\d{10}"
title="Please enter a 10-digit mobile number">
<span id="mobileError" class="error"></span>
</div>
<!-- Email -->
<div class="form-group">
<label for="email">Email:</label><br>
<input type="email" id="email" name="email"
placeholder="Enter your email">
<span id="emailError" class="error"></span>
</div>
</fieldset>
<fieldset>
<legend>Crop Details</legend>
<!-- Plot ID -->
<div class="form-group">
<label for="plotID">Plot ID:</label><br>
<input type="text" id="plotID" name="plotID"
placeholder="e.g., P-101">
<span id="plotIDError" class="error"></span>
</div>
<!-- Village -->
<div class="form-group">
<label for="village">Village:</label><br>
<input type="text" id="village" name="village"
placeholder="Enter Village Name">
<span id="villageError" class="error"></span>
</div>
<!-- Crop Stage -->
<div class="form-group">
<label for="cropStage">Crop Stage:</label><br>
<select id="cropStage" name="cropStage">
<option value="">Select Crop Stage</option>
<option value="Sowing">Sowing</option>
<option value="Growing">Growing</option>
<option value="Harvesting">Harvesting</option>
</select>
<span id="cropStageError" class="error"></span>
</div>
<div class="form-group">
<label for="soilType">Soil Type:</label><br>
<select id="soilType" name="soilType">
    <option value="">Select Soil Type</option>
<option value="Loamy">Loamy</option>
<option value="Sandy">Sandy</option>
<option value="Clay">Clay</option>
<option value="Silty">Silty</option>
</select>
<span id="soilTypeError" class="error"></span>
</div>
<!-- Irrigation Method -->
<div class="form-group">
<label for="irrigationMethod">Irrigation
Method:</label><br>
<select id="irrigationMethod" name="irrigationMethod">
<option value="">Select Irrigation Method</option>
<option value="Drip">Drip</option>
<option value="Sprinkler">Sprinkler</option>
<option value="Flood">Flood</option>
</select>
<span id="irrigationMethodError" class="error"></span>
</div>
<!-- Soil Moisture -->
<div class="form-group">
<label for="soilMoisture">Soil Moisture (%):</label><br>
<input type="number" id="soilMoisture" name="soilMoisture"
min="0" max="100"
placeholder="Enter Soil Moisture %">
<span id="soilMoistureError" class="error"></span>
</div>
<!-- Date -->
<div class="form-group">
<label for="registrationDate">Registration
Date:</label><br>
<input type="date" id="registrationDate"
name="registrationDate">
<span id="registrationDateError" class="error"></span>
</div>
<!-- Farm Photo Upload -->
<div class="form-group">
    <label for="farmPhoto">Farm Photo:</label><br>
<input type="file" id="farmPhoto" name="farmPhoto"
accept="image/*">
<span id="farmPhotoError" class="error"></span>
</div>
</fieldset>
<div style="display: flex; justify-content: space-between;
align-items: center; width: 35%; margin: 15px auto;">
<input type="submit" value="Register">
<input type="reset" value="Clear Form">
</div>
</form>
